# ---------------------------------------------------------------------
# SECTEURS PRIORITAIRES (niveau 2)
# ---------------------------------------------------------------------
sectors:
  # Toute offre d'une entreprise de ces secteurs est mise en avant,
  # même si l'entreprise n'est pas dans la liste ci-dessus. Valeurs :
  #   insurance            = assurance
  #   banking              = banque
  #   agriculture_agrifood = agriculture et agro-industrie
  #   consumer_goods       = grande consommation
  #   retail               = distribution
  priority:
    - insurance
    - banking
    - agriculture_agrifood
    - consumer_goods
    - retail
  # Fichier de référence (alias d'entreprises, codes NAF par secteur).
  # Ne pas modifier sauf besoin avancé.
  reference_file: "sectors.yaml"


# ---------------------------------------------------------------------
# SOURCES D'OFFRES
# ---------------------------------------------------------------------
sources:
  # API officielle de France Travail (clés dans .env).
  # Désactivée : l'accès à l'API se fait désormais sur demande.
  france_travail:
    enabled: false

  # API de l'agrégateur Adzuna (clés dans .env).
  # Désactivée : le compte gratuit est limité à quelques appels de test.
  adzuna:
    enabled: false

  # Sites carrière des entreprises de la liste "companies".
  career_pages:
    enabled: true
    # Pause entre deux requêtes vers un même site, en secondes
    # (politesse envers les sites, à ne pas réduire).
    request_delay_seconds: 2
    # Délai maximum d'attente d'une réponse, en secondes.
    timeout_seconds: 30
    # Nombre de sites lus en même temps (jamais deux requêtes simultanées
    # vers un même site). 1 = un site après l'autre.
    parallel_sites: 6

  # Alertes e-mail des sites d'emploi, lues dans une boîte Gmail
  # (accès en lecture seule, identifiants dans .env).
  # Désactivé tant que l'accès Gmail n'est pas configuré.
  email_alerts:
    enabled: false
    # Seuls les e-mails portant ce libellé Gmail sont lus.
    gmail_label: "Alertes-emploi"
    # Seuls les e-mails reçus à partir de cette date sont lus
    # (format AAAA-MM-JJ, entre guillemets).
    start_date: "2026-11-09"
    # Un bloc par site. Dans allowed_senders, indiquez les adresses
    # exactes des expéditeurs relevées dans les alertes reçues :
    # un e-mail d'un autre expéditeur n'est jamais lu.
    providers:
      linkedin:
        enabled: true
        allowed_senders: ["jobalerts-noreply@linkedin.com"]
      indeed:
        enabled: true
        allowed_senders: [donotreply@jobalert.indeed.com]
      hellowork:
        enabled: true
        allowed_senders: [alerte@emails.hellowork.com]
      welcome_to_the_jungle:
        enabled: true
        allowed_senders: []
      apec:
        enabled: true
        allowed_senders: []
      cadremploi:
        enabled: true
        allowed_senders: []
      # Site généraliste avec beaucoup d'offres hors cible :
      # désactivé par défaut.
      meteojob:
        enabled: false
        allowed_senders: []


# ---------------------------------------------------------------------
# VÉRIFICATION À LA SOURCE
# ---------------------------------------------------------------------
source_verification:
  # true = toute offre venant d'un site d'emploi (alerte e-mail) est
  # recherchée sur le site carrière de l'entreprise, si celle-ci est dans
  # "companies" avec un connecteur. Statuts : vérifiée à la source,
  # vérification en attente, absente du site carrière, non vérifiable.
  enabled: true
  # true = une offre absente du site carrière n'est pas gardée : elle
  # est inscrite dans l'onglet des offres écartées, avec la raison.
  exclude_if_missing_on_career_site: true
  # Délai avant de conclure qu'une offre est absente du site carrière,
  # en heures (un site carrière peut publier avec un peu de retard).
  grace_period_hours: 24
  # true = pendant ce délai, l'offre est quand même notifiée, avec la
  # mention "vérification en attente" (la rapidité reste prioritaire).
  notify_while_pending: true
  # Score de ressemblance (de 0 à 1) à partir duquel deux annonces
  # sont considérées comme la même offre.
  match_threshold: 0.85
  # Entre ce score et le précédent, les deux annonces sont rapprochées
  # mais signalées "correspondance probable" pour contrôle manuel.
  probable_match_threshold: 0.70
  # true = les offres du fichier de suivi sont revérifiées
  # régulièrement, et celles qui ont disparu en ligne sont signalées.
  recheck_tracked_offers: true
  # Intervalle entre deux revérifications, en heures.
  recheck_interval_hours: 24


# ---------------------------------------------------------------------
# LANCEMENT AUTOMATIQUE
# ---------------------------------------------------------------------
schedule:
  # Fuseau horaire des réglages ci-dessous.
  timezone: "Europe/Paris"
  # Jours de fonctionnement : mon, tue, wed, thu, fri, sat, sun.
  days:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  # Heure du premier passage et heure limite (de 0 à 23).
  start_hour: 8
  end_hour: 20
  # Intervalle entre deux passages, en heures.
  interval_hours: 2


# ---------------------------------------------------------------------
# STOCKAGE DES OFFRES
# ---------------------------------------------------------------------
storage:
  # Base de données locale (SQLite) : mémoire des offres déjà vues et
  # déjà notifiées, et texte complet de chaque offre. Dans private/.
  database_path: "private/job_agent.db"


# ---------------------------------------------------------------------
# FICHIER DE SUIVI DES CANDIDATURES
# ---------------------------------------------------------------------
tracking:
  # Type de fichier :
  #   google_sheets = feuille Google créée par l'agent (mode cloud, voir
  #                   « uv run job-agent sheets-import » pour y copier l'Excel)
  #   excel         = fichier Excel sur votre ordinateur
  #   csv           = fichier CSV sur votre ordinateur
  backend: excel
  google_sheets:
    # Identifiant de la feuille : la partie de son adresse située entre
    # "/d/" et "/edit".
    spreadsheet_id: ""
  excel:
    path: "private/job_tracking.xlsx"
  csv:
    path: "private/job_tracking.csv"
  # true = les offres écartées (par un filtre ou par la vérification à
  # la source) sont conservées dans un onglet séparé, avec la raison,
  # pour contrôler que les règles ne se trompent pas.
  keep_rejected: true


# ---------------------------------------------------------------------
# NOTIFICATIONS
# ---------------------------------------------------------------------
notifications:
  # Canal : telegram, email ou none (aucune notification).
  # Identifiants dans .env.
  channel: telegram
  # true = le tout premier passage remplit le fichier de suivi sans
  # envoyer de notification (évite des centaines de messages d'un coup).
  silent_first_run: true
  # Nombre maximum de notifications par passage. Au-delà, un seul
  # message récapitulatif est envoyé (évite les envois en masse).
  max_per_run: 20
  # Informations affichées dans chaque message :
  #   title, company, location, contract, publication_date, url,
  #   experience_flag     (expérience non précisée),
  #   priority_flag       (secteur prioritaire),
  #   verification_status (vérifiée à la source, en attente,
  #                        non vérifiable),
  #   match_score         (score de correspondance avec le CV)
  fields:
    - title
    - company
    - location
    - contract
    - publication_date
    - url
    - experience_flag
    - priority_flag
    - verification_status
    - match_score


# ---------------------------------------------------------------------
# INTELLIGENCE ARTIFICIELLE (lettre de motivation, CV)
# ---------------------------------------------------------------------
ai:
  # Fournisseur d'IA. Valeur possible pour l'instant : gemini.
  provider: gemini
  # Modèle utilisé. Laisser vide = gemini-3.5-flash (niveau gratuit),
  # avec d'autres modèles gratuits en secours quand il est saturé.
  # Seul le texte public des offres est envoyé, jamais votre CV ici.
  model: ""
  # CV SANS coordonnées (ni nom, ni téléphone, ni e-mail), dans le
  # dossier private/. C'est le seul CV envoyé à l'IA.
  anonymized_cv_path: "private/cv_anonymized.md"
  # true = sécurité supplémentaire : tout e-mail ou numéro de téléphone
  # restant est retiré automatiquement avant l'envoi à l'IA.
  strip_contact_details: true

# ---------------------------------------------------------------------
# FEUILLE D'ÉTIQUETAGE (futur modèle « offre pertinente pour moi »)
# ---------------------------------------------------------------------
labelling:
  # Employeurs dont les offres reçoivent « non » d'office dans la feuille
  # d'étiquetage (elles restent notifiées). Un nom ou un mot du nom de
  # l'entreprise suffit. Les ESN et cabinets écartés par les filtres et
  # les intitulés « consultant » reçoivent aussi « non ».
  not_relevant_companies:
    - "consulting"
    - "advisory"
    - "EY"
    - "Ernst & Young"
    - "Deloitte"
    - "PwC"
    - "KPMG"
    - "Mazars"
    - "Grant Thornton"
    - "BDO"
    - "RSM"
    - "Wavestone"
    - "Converteo"
    - "Onepoint"
    - "Talan"
    - "Sia Partners"
    - "BearingPoint"
    - "Capgemini Invent"
    - "McKinsey"
    - "Boston Consulting Group"
    - "BCG"
    - "Bain"
    - "Roland Berger"
    - "Kearney"
    - "Julhiet Sterwen"
    - "Square Management"
    - "mc2i"
    - "Magellan Partners"
    - "Avanade"
    - "Alvarez & Marsal"
    - "Eleven Strategy"
    - "Ekimetrics"
    - "Quantmetry"

# ---------------------------------------------------------------------
# MODE CLOUD (GitHub Actions, dépôt privé)
# ---------------------------------------------------------------------
cloud:
  # true = l'agent tourne dans GitHub Actions, dans le dépôt PRIVÉ ci-dessous
  # (mis en place par « uv run job-agent cloud-setup »). Un passage lancé sur
  # votre ordinateur est alors refusé, pour ne jamais notifier deux fois.
  # Le suivi doit être Google Sheets (tracking.backend: google_sheets).
  enabled: false
  repository: ""


# ---------------------------------------------------------------------
# RÉPONSES DES RECRUTEURS (libellé Gmail dédié)
# ---------------------------------------------------------------------
application_replies:
  # true = l'agent lit les réponses des recruteurs que VOUS rangez dans le
  # libellé ci-dessous (à la main ou par un filtre Gmail), en lecture
  # seule, et vous propose un statut (Telegram et onglet « Réponses »).
  # Aucun autre e-mail n'est lu ; le texte des e-mails n'est jamais
  # envoyé à une IA ni conservé.
  enabled: false
  gmail_label: "Candidatures"
  # Seuls les e-mails de ce libellé reçus à partir de cette date sont lus.
  start_date: "2026-11-12"
