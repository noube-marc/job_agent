# =====================================================================
# job-agent : fichier de configuration (EXEMPLE)
#
# Mode d'emploi :
#   1. Copiez ce fichier et nommez la copie "config.yaml".
#   2. Modifiez les valeurs de config.yaml selon vos critères.
#   3. config.yaml est personnel : il n'est jamais envoyé sur GitHub.
#
# Règles d'écriture (format YAML) :
#   - Indentation avec des ESPACES uniquement, jamais de tabulation.
#   - Une liste s'écrit avec des lignes qui commencent par "- ".
#   - Oui / non s'écrivent true / false (jamais yes / no).
#   - Mettez un texte entre guillemets s'il contient ":" ou "#".
#   - Les lignes qui commencent par "#" sont des commentaires.
#
# Les secrets (clés d'API, mots de passe) ne vont PAS ici :
# ils vont dans le fichier .env (voir .env.example).
# =====================================================================

# Version du format de ce fichier. Ne pas modifier.
config_version: 1

# Nom libre de ce profil, utilisé dans les journaux et les tests.
profile_name: "data-analyst-example"


# ---------------------------------------------------------------------
# POSTES RECHERCHÉS
# ---------------------------------------------------------------------
search:
  # Intitulés recherchés. La comparaison ignore les majuscules, les
  # accents et les mentions H/F ou F/H.
  job_titles:
    # Postes principaux.
    core:
      - "Data Analyst"
      - "Data Engineer"
      - "Analytics Engineer"
      - "Ingénieur données"
      - "Ingénieur data"
      - "BI Analyst"
      - "Développeur BI"
      - "Ingénieur BI"
      - "Business Analyst data"
      - "Data Analyst Power BI"
      - "Product Data Analyst"
      - "Chargé d'études statistiques"
      - "Coordinateur d'études statistiques"
    # Postes de Data Scientist accessibles avec le profil.
    data_science:
      - "Data Scientist"
      - "Data Scientist junior"
      - "Data Analyst / Data Scientist"
      - "Data Scientist prévision"
      - "Data Scientist forecasting"
      - "Data Scientist décisionnel"
      - "Statisticien"
      - "Chargé d'études data science"

  # Une offre dont l'intitulé contient l'un de ces mots est écartée.
  # Recherche élargie dans l'INTITULÉ des offres (majuscules, accents,
  # pluriels et féminins ignorés). Une offre est candidate si son intitulé
  # contient un poste recherché ci-dessus ou un terme de base ; sinon un
  # mot-clé élargi ; sinon un outil de votre CV. Ce qui a déclenché la
  # sélection est indiqué sur Telegram et dans le suivi (« sélection : »).
  # Listes vides : seuls les postes recherchés comptent.
  title_match:
    base_terms: ["data", "donnée", "reporting", "analyste", "analyst"]
    extended_keywords:
      # Analyse et BI
      - "BI"
      - "business intelligence"
      - "décisionnel"
      - "analytics"
      - "analytique"
      - "dashboard"
      - "tableau de bord"
      - "dataviz"
      - "data visualisation"
      - "KPI"
      - "indicateurs"
      - "pilotage"
      - "performance"
      - "contrôle de gestion"
      - "contrôleur de gestion"
      - "insights"
      # Statistiques et études
      - "statistique"
      - "statisticien"
      - "chargé d'études"
      # Data engineering
      - "ETL"
      - "ELT"
      - "pipeline de données"
      - "data warehouse"
      - "entrepôt de données"
      - "data lake"
      - "lakehouse"
      - "modélisation de données"
      - "data modeling"
      - "DataOps"
      # Qualité et gouvernance
      - "qualité des données"
      - "data quality"
      - "gouvernance des données"
      - "data governance"
      - "data management"
      - "MDM"
      # Data science
      - "data science"
      - "machine learning"
      - "apprentissage automatique"
      - "intelligence artificielle"
      - "IA"
      - "AI"
      - "modèle prédictif"
      - "prévision"
      - "forecasting"
      # Analyse métier
      - "business analyst"
    # Outils de votre CV (les outils trop génériques, comme Excel, sont exclus).
    tools: ["Python", "SQL", "Power BI", "Power Query", "DAX", "Microsoft Fabric", "Databricks", "Azure", "dbt", "Airflow", "GCP", "Google Cloud", "SPSS"]

  excluded_title_keywords:
    - "consultant"

  # Employeurs écartés : ESN, cabinets de recrutement, agences d'intérim
  # et sites d'emploi qui republient des offres. Un nom ou un mot du nom
  # de l'entreprise suffit. Les cabinets d'audit et de conseil (EY,
  # Deloitte, PwC, KPMG, Forvis Mazars, Wavestone...) et les employeurs
  # publics qui recrutent via leur propre site (La Sécu recrute) ne sont
  # pas dans cette liste : ils recrutent pour eux-mêmes.
  excluded_companies:
    # Mots génériques
    - "interim"
    - "recrutement"
    - "recruitment"
    - "staffing"
    - "portage salarial"
    # ESN (entreprises de services du numérique)
    - "Accenture"
    - "Capgemini"
    - "Sopra Steria"
    - "Alten"
    - "Akkodis"
    - "Altran"
    - "Inetum"
    - "Atos"
    - "CGI"
    - "Devoteam"
    - "Micropole"
    - "Keyrus"
    - "Business & Decision"
    - "Actinvision"
    - "Klint"
    - "Niji"
    - "Nexton"
    - "Segula"
    - "Smile Group"
    - "Groupe Open"
    - "Decideom"
    - "Hedon Technologies"
    - "Nowbrains"
    - "Kaizen Solutions"
    - "Sinbad conseil"
    - "Extia"
    - "Davidson"
    - "Aubay"
    - "Expleo"
    - "Ausy"
    - "Umanis"
    - "Jems"
    - "Klanik"
    - "Infotel"
    - "Astek"
    # Cabinets de recrutement et intérim
    - "Externatic"
    - "Selescope"
    - "Collective Works"
    - "Hays"
    - "Michael Page"
    - "Page Personnel"
    - "Robert Half"
    - "Robert Walters"
    - "Expectra"
    - "Adecco"
    - "Randstad"
    - "Manpower"
    - "Fed Human"
    - "Fed IT"
    - "Fed Finance"
    - "Capsearch"
    - "Hiring Partners"
    - "Silkhom"
    # Sites d'emploi qui republient des offres
    - "Talents Handicap"

  # Expressions de la description qui trahissent un intermédiaire. Elles
  # sont précises exprès : un cabinet de conseil parle aussi de « notre
  # client » pour ses propres missions. Pas appliquées aux offres lues
  # sur un site carrière d'entreprise.
  intermediary_phrases:
    - "pour le compte de notre client"
    - "pour l'un de nos clients"
    - "notre client recherche"
    - "notre client recrute"
    - "cabinet de recrutement"
    - "cabinet de conseil en recrutement"
    - "entreprise de services du numérique"
    - "entreprise de services numériques"
    - "nous sommes une esn"
    - "notre esn"

  # Règle spéciale pour les postes de Business Analyst : ils ne sont
  # gardés que si la description cite assez de compétences techniques.
  business_analyst:
    # Mots qui identifient un poste de Business Analyst dans l'intitulé.
    title_keywords:
      - "business analyst"
    # Compétences techniques recherchées dans la description.
    technical_skills:
      - "SQL"
      - "Python"
      - "Power BI"
      - "DAX"
      - "modélisation de données"
      - "ETL"
    # Nombre minimum de ces compétences pour garder l'offre.
    min_technical_skills: 2


# ---------------------------------------------------------------------
# LIEU
# ---------------------------------------------------------------------
location:
  # Code du pays (deux lettres, entre guillemets).
  country: "FR"
  # Régions acceptées. Liste vide = tout le pays.
  # Exemple : ["Île-de-France", "Auvergne-Rhône-Alpes"]
  regions: []
  # Modes de travail acceptés :
  #   onsite      = sur site
  #   hybrid      = hybride (une partie en télétravail)
  #   full_remote = télétravail complet
  work_modes:
    - onsite
    - hybrid
    - full_remote


# ---------------------------------------------------------------------
# CONTRATS
# ---------------------------------------------------------------------
contracts:
  # Types de contrat acceptés, parmi :
  #   permanent      = CDI
  #   fixed_term     = CDD
  #   internship     = stage
  #   apprenticeship = alternance
  #   freelance      = freelance / indépendant
  accepted:
    - permanent
    - fixed_term


# ---------------------------------------------------------------------
# EXPÉRIENCE DEMANDÉE
# ---------------------------------------------------------------------
experience:
  # L'agent lit l'expérience MINIMUM demandée par l'offre
  # ("3 à 5 ans" donne 3). L'offre est écartée si ce minimum est
  # supérieur ou égal à cette valeur.
  exclude_if_min_years_at_least: 5
  # Offre sans expérience précisée : true = gardée, avec la mention
  # "expérience non précisée" ; false = écartée.
  keep_if_unspecified: true


# ---------------------------------------------------------------------
# FRAÎCHEUR DES OFFRES
# ---------------------------------------------------------------------
freshness:
  # Âge maximum d'une offre, en jours. Au-delà, elle est écartée.
  max_age_days: 7
  # Date utilisée pour calculer l'âge, par ordre de préférence :
  #   career_site = date de publication sur le site carrière
  #   job_board   = date de publication sur le site d'emploi
  #   first_seen  = date de première détection par l'agent
  # La première date disponible est utilisée.
  date_priority:
    - career_site
    - job_board
    - first_seen
  # Offre sans aucune date de publication connue : true = gardée,
  # avec la mention "date estimée" ; false = écartée.
  keep_if_date_unknown: true


# ---------------------------------------------------------------------
# TRI
# ---------------------------------------------------------------------
sorting:
  # Les offres sont toujours triées de la plus récente à la plus
  # ancienne. true = à date égale, les secteurs prioritaires passent
  # en premier.
  priority_sector_tiebreak: true


# ---------------------------------------------------------------------
# PROFIL TECHNIQUE (détection des postes trop avancés)
# ---------------------------------------------------------------------
technical_profile:
  # Compétences maîtrisées (à adapter à votre CV).
  mastered_skills:
    - "SQL"
    - "Python"
    - "R"
    - "Power BI"
    - "DAX"
    - "Power Query"
    - "Azure Data Factory"
    - "Synapse"
    - "Microsoft Fabric"
    - "Databricks"
    - "dbt"
    - "Airflow"
    - "Git"
    - "ETL"
  # Technologies non maîtrisées qui rendent un poste trop avancé
  # lorsqu'elles sont EXIGÉES.
  blocking_technologies:
    - "Scala"
    - "Java"
    - "Kafka"
    - "Flink"
    - "Spark Streaming"
    - "Kubernetes"
    - "Terraform"
    - "Hadoop"
    - "Hive"
    - "Cassandra"
    - "MongoDB"
    - "AWS Glue"
    - "Redshift"
    - "EMR"
  # Nombre de technologies bloquantes exigées à partir duquel l'offre
  # est écartée comme "trop avancée".
  too_advanced_threshold: 3
  # Nombre à partir duquel l'offre est gardée mais signalée
  # "écart technique" (doit être inférieur au seuil précédent).
  technical_gap_threshold: 1
  # Mots de l'intitulé qui signalent un poste trop avancé
  # (l'offre est écartée). "senior" couvre aussi "sénior".
  advanced_title_keywords:
    - "senior"
    - "lead"
    - "tech lead"
    - "staff"
    - "principal"
    - "architecte"
    - "architect"
    - "head of"
    - "manager"
    - "responsable d'équipe"
    - "expert"
  # Expressions de la description qui signalent un rôle trop avancé.
  advanced_mission_keywords:
    - "encadrement d'équipe"
    - "management d'équipe"
    - "manager une équipe"
    - "référent technique"
    - "définir l'architecture"
  # Expressions qui rendent une technologie FACULTATIVE quand elles
  # l'accompagnent (elle ne compte alors pas comme exigée).
  optional_markers:
    - "un plus"
    - "idéalement"
    - "apprécié"
    - "souhaité"
    - "serait un atout"
    - "nice to have"
  # Mots de l'intitulé qui signalent un poste ouvert aux débutants : l'offre
  # n'est jamais écartée comme "trop avancée" (les mentions restent
  # signalées) et passe en premier parmi les offres du même jour.
  junior_title_keywords:
    - "junior"
    - "débutant"
    - "débutante"
    - "jeune diplômé"
    - "jeune diplômée"


# ---------------------------------------------------------------------
