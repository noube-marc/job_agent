# Tâche du dépôt PRIVÉ d'exécution (installée par « uv run job-agent cloud-setup »,
# qui y inscrit la plage horaire de config.yaml).
# GitHub la démarre toutes les heures (heure UTC), mais saute parfois des
# démarrages aux heures chargées : la première étape, très courte, arrête la
# tâche hors de la plage horaire ou si le dernier passage est trop récent.
# Un démarrage sauté est ainsi rattrapé l'heure suivante.
# Un service externe (par exemple cron-job.org) peut aussi la démarrer chaque
# heure par l'API GitHub, avec l'entrée « scheduled » à true : ces démarrages
# passent par le même contrôle. Un lancement manuel, lui, part tout de suite.
# Le code vient du dépôt public ; la mémoire de l'agent est gardée CHIFFRÉE
# dans la branche « state ».
name: job-agent

on:
  schedule:
    - cron: "__CRON__"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Démarrage programmé (contrôle de la plage horaire)"
        required: false
        default: "false"

concurrency:
  group: job-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_AGENT_STATE_KEY: ${{ secrets.JOB_AGENT_STATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
    steps:
      - name: Faut-il lancer un passage ?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: __TIMEZONE__
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scheduled }}" != "true" ]; then
            echo "Lancement manuel."; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          day=$(date +%u); hour=$(date +%-H)
          if ! echo " __DAYS__ " | grep -q " $day " || [ "$hour" -lt __START_HOUR__ ] || [ "$hour" -gt __END_HOUR__ ]; then
            echo "Hors de la plage horaire."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/commits/state" --jq .commit.committer.date || echo "")
          if [ -n "$last" ]; then
            age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
            if [ "$age" -lt __MIN_GAP_MINUTES__ ]; then
              echo "Dernier passage il y a $age min : rien à faire."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Code de l'agent (dépôt public)
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: noube-marc/job_agent
          path: app
      - name: Configuration et CV chiffrés (branche main du dépôt privé)
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Mémoire chiffrée (branche state)
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.go == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Modèle du score CV (cache)
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - name: Installer
        if: steps.gate.outputs.go == 'true'
        working-directory: app
        run: uv sync --frozen
      - name: Déchiffrer la configuration et le CV
        if: steps.gate.outputs.go == 'true'
        working-directory: app
        run: uv run job-agent cloud-unpack ../runner/secure
      - name: Restaurer la mémoire
        if: steps.gate.outputs.go == 'true'
        id: restore
        working-directory: app
        run: uv run job-agent cloud-state import ../state/state.bin
      - name: Passage de l'agent
        if: steps.gate.outputs.go == 'true'
        working-directory: app
        run: uv run job-agent run
      - name: Sauvegarder la mémoire (chiffrée)
        # Never after a failed restore: an empty memory must not replace the real one.
        if: always() && steps.gate.outputs.go == 'true' && steps.restore.outcome == 'success'
        working-directory: app
        run: uv run job-agent cloud-state export ../state/state.bin
      - name: Publier la mémoire
        if: always() && steps.gate.outputs.go == 'true' && steps.restore.outcome == 'success'
        working-directory: state
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git checkout --orphan next
          git add state.bin
          git commit -q -m "state"
          git push -q -f origin next:state
