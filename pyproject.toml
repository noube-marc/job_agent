[project]
name = "job-agent"
version = "0.1.0"
description = "Agent de veille emploi : détecte les nouvelles offres au plus tôt, les filtre selon vos critères et suit vos candidatures."
readme = "README.md"
authors = [
    { name = "noube-marc", email = "135634498+noube-marc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.6",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
