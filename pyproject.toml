[project]
name = "job-agent"
version = "0.1.0"
description = "Agent de veille emploi : détecte les nouvelles offres au plus tôt, les filtre selon vos critères et suit vos candidatures."
readme = "README.md"
authors = [
    { name = "noube-marc", email = "135634498+noube-marc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=3.1.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "tzdata>=2026.6",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Errors, pyflakes, imports order, modern Python, bugbear, simplifications.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008: pydantic Field() defaults; SIM118: sqlite3.Row needs .keys() ("in row" tests values);
# B905: zip() pairs lists of equal length by construction; SIM108: if/else kept when clearer.
ignore = ["B008", "SIM118", "B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["job_agent", "conftest"]
