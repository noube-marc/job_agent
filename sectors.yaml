# =====================================================================
# job-agent : fichier de référence des secteurs
# =====================================================================
# Sert à reconnaître le secteur d'une entreprise à partir de son nom,
# même quand l'offre est publiée sous une marque ou une filiale.
#
# Fichier partagé entre tous les utilisateurs : il ne contient aucune
# donnée personnelle. Les secteurs mis en avant pour vous se choisissent
# dans config.yaml (sectors.priority).
#
# Pour chaque entreprise :
#   name    = nom affiché dans le suivi
#   aliases = autres noms possibles (marques, filiales, anciennes
#             dénominations). La comparaison ignore les majuscules,
#             les accents et la ponctuation.
# =====================================================================

